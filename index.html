<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cinder Isle</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f16; overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif; }
      canvas { display: block; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center;
        background: #0b0f16; color: #93a2b5; z-index: 100;
        font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
      #boot.done { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">Loading…</div>
    <script type="module">
      // Hide the boot splash once the module graph has executed.
      window.addEventListener('game-ready', () => {
        document.getElementById('boot')?.classList.add('done');
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
