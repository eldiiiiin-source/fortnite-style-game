<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinder Isle</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0c10; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; inset: 0; pointer-events: none;
             font: 14px/1.4 system-ui, sans-serif; color: #fff; }
      #click-to-play { position: fixed; inset: 0; display: grid; place-items: center;
             background: rgba(8,10,14,0.72); color: #fff; cursor: pointer;
             font: 600 18px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="click-to-play">Click to play — WASD move, Space jump, F1–F4 build, G edit</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
